name: PlayEconomy Library Builder

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: Run the full master plan or a single brief
        required: true
        type: choice
        options:
          - full_plan
          - single_brief
        default: full_plan
      content_file:
        description: Brief used only when run_mode is single_brief
        required: true
        default: library/briefs/consolas-xbox.json
      max_downloads:
        description: Maximum assets to add in this run
        required: true
        default: "20"
      dry_run:
        description: Analyze only; do not download or write to Drive
        required: true
        type: boolean
        default: true
      enable_editorial_sources:
        description: Enable configured official/editorial sources for library building
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: playeconomy-library-builder
  cancel-in-progress: false

jobs:
  build-library:
    name: Populate reusable asset library
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Google Drive OAuth secrets
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          missing=()
          [[ -n "$GOOGLE_DRIVE_CLIENT_ID" ]] || missing+=(GOOGLE_DRIVE_CLIENT_ID)
          [[ -n "$GOOGLE_DRIVE_CLIENT_SECRET" ]] || missing+=(GOOGLE_DRIVE_CLIENT_SECRET)
          [[ -n "$GOOGLE_DRIVE_REFRESH_TOKEN" ]] || missing+=(GOOGLE_DRIVE_REFRESH_TOKEN)
          if (( ${#missing[@]} )); then
            echo "::error::Missing required Google Drive OAuth secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Exchange Google Drive OAuth refresh token
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --request POST "https://oauth2.googleapis.com/token"             --header "Content-Type: application/x-www-form-urlencoded"             --data-urlencode "client_id=$GOOGLE_DRIVE_CLIENT_ID"             --data-urlencode "client_secret=$GOOGLE_DRIVE_CLIENT_SECRET"             --data-urlencode "refresh_token=$GOOGLE_DRIVE_REFRESH_TOKEN"             --data-urlencode "grant_type=refresh_token"             --output "$response_file"
          access_token="$(node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!r.access_token)process.exit(1);process.stdout.write(r.access_token)' "$response_file")"
          echo "::add-mask::$access_token"
          printf 'GOOGLE_DRIVE_ACCESS_TOKEN=%s\n' "$access_token" >> "$GITHUB_ENV"

      - name: Prepare library policy
        env:
          ENABLE_EDITORIAL: ${{ inputs.enable_editorial_sources }}
        run: |
          set -euo pipefail
          library_config="$RUNNER_TEMP/playeconomy-library-config.json"
          node -e '
            const fs=require("fs");
            const [src,dst,enabled]=process.argv.slice(1);
            const c=JSON.parse(fs.readFileSync(src,"utf8"));
            c.rights ??= {};
            c.rights.copyrighted_editorial_enabled = enabled === "true";
            fs.writeFileSync(dst, JSON.stringify(c,null,2)+"\n");
          ' asset-manager/config.json "$library_config" "$ENABLE_EDITORIAL"
          printf 'ASSET_MANAGER_CONFIG_PATH=%s\n' "$library_config" >> "$GITHUB_ENV"

      - name: Populate library
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          CONTENT_FILE: ${{ inputs.content_file }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_DOWNLOADS: ${{ inputs.max_downloads }}
          ENABLE_EDITORIAL: ${{ inputs.enable_editorial_sources }}
        run: |
          set -euo pipefail
          mkdir -p asset-manager/reports/library-builder
          if [[ "$RUN_MODE" == "full_plan" ]]; then
            mapfile -t briefs < <(node -e '
              const p=require("./library/library-plan.json");
              for (const b of p.batches) {
                if (!b.brief) throw new Error("Missing brief for "+b.id);
                console.log(b.brief);
              }
            ')
          else
            briefs=("$CONTENT_FILE")
          fi

          : > asset-manager/reports/library-builder-summary.ndjson
          failures=0
          for brief in "${briefs[@]}"; do
            batch="$(basename "$brief" .json)"
            report="asset-manager/reports/library-builder/${batch}.json"
            echo "::group::Library batch: $batch"
            if node scripts/assets/asset-manager.mjs \
              --config "$ASSET_MANAGER_CONFIG_PATH" \
              --content "$brief" \
              --dry-run "$DRY_RUN" \
              --max-downloads "$MAX_DOWNLOADS" \
              --allow-copyrighted-editorial "$ENABLE_EDITORIAL" \
              --report "$report"; then
              printf '{"batch":"%s","brief":"%s","status":"success","report":"%s"}\n' "$batch" "$brief" "$report" >> asset-manager/reports/library-builder-summary.ndjson
            else
              failures=$((failures+1))
              printf '{"batch":"%s","brief":"%s","status":"failed","report":"%s"}\n' "$batch" "$brief" "$report" >> asset-manager/reports/library-builder-summary.ndjson
            fi
            echo "::endgroup::"
          done

          node -e '
            const fs=require("fs");
            const rows=fs.readFileSync("asset-manager/reports/library-builder-summary.ndjson","utf8").trim().split(/\n+/).filter(Boolean).map(JSON.parse);
            fs.writeFileSync("asset-manager/reports/library-builder-summary.json", JSON.stringify({
              generated_at:new Date().toISOString(),
              mode:process.env.RUN_MODE,
              batches:rows,
              totals:{batches:rows.length,success:rows.filter(x=>x.status==="success").length,failed:rows.filter(x=>x.status==="failed").length}
            },null,2)+"\n");
          '
          if (( failures > 0 )); then
            echo "::error::$failures library batch(es) failed"
            exit 1
          fi

      - name: Upload library report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playeconomy-library-builder-report
          path: |
            asset-manager/reports/library-builder/
            asset-manager/reports/library-builder-summary.json
            asset-manager/manifest.json
          if-no-files-found: warn
          retention-days: 7
