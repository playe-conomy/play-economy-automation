name: PlayEconomy Asset Manager

on:
  workflow_dispatch:
    inputs:
      content_file:
        description: Content definition to analyze
        required: true
        default: content/guitar-hero.json
      dry_run:
        description: Analyze candidates without downloads, Drive writes, or manifest changes
        required: true
        type: boolean
        default: true
      max_downloads:
        description: Maximum proposed downloads when dry run is disabled
        required: true
        default: "5"
      enable_copyrighted_editorial_trial:
        description: Temporarily enable the global copyrighted-editorial layer for this manual run only
        required: true
        type: boolean
        default: false
      allow_copyrighted_editorial:
        description: Permit only registry-verified copyrighted editorial candidates when globally enabled
        required: true
        type: boolean
        default: false
      bootstrap_manifest:
        description: Optional repository-local V3.4 manifest used only to initialize a missing Drive catalog
        required: false
        default: ""
      bootstrap_only:
        description: Only initialize a missing Drive catalog from bootstrap_manifest, then exit
        required: false
        type: boolean
        default: false
      expected_bootstrap_assets:
        description: Required asset count for bootstrap_only validation
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: playeconomy-asset-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manage-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate bootstrap-only inputs
        if: inputs.bootstrap_only == true
        run: |
          set -euo pipefail
          [[ "${{ inputs.dry_run }}" == "false" ]] || { echo "::error::bootstrap_only requires dry_run=false"; exit 1; }
          [[ -n "${{ inputs.bootstrap_manifest }}" ]] || { echo "::error::bootstrap_only requires bootstrap_manifest"; exit 1; }
          [[ -f "${{ inputs.bootstrap_manifest }}" ]] || { echo "::error::bootstrap_manifest was not found in the checkout"; exit 1; }
          [[ "${{ inputs.expected_bootstrap_assets }}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::bootstrap_only requires a positive expected_bootstrap_assets value"; exit 1; }

      - name: Prepare controlled editorial trial config
        env:
          ENABLE_COPYRIGHTED_EDITORIAL_TRIAL: ${{ inputs.enable_copyrighted_editorial_trial }}
        run: |
          set -euo pipefail
          if [[ "$ENABLE_COPYRIGHTED_EDITORIAL_TRIAL" == "true" ]]; then
            trial_config="$RUNNER_TEMP/playeconomy-asset-manager-trial-config.json"
            node -e '
              const fs = require("fs");
              const [source, destination] = process.argv.slice(1);
              const config = JSON.parse(fs.readFileSync(source, "utf8"));
              config.rights ??= {};
              config.rights.copyrighted_editorial_enabled = true;
              fs.writeFileSync(destination, `${JSON.stringify(config, null, 2)}\n`, "utf8");
            ' asset-manager/config.json "$trial_config"
            printf 'ASSET_MANAGER_CONFIG_PATH=%s\n' "$trial_config" >> "$GITHUB_ENV"
          else
            printf 'ASSET_MANAGER_CONFIG_PATH=%s\n' 'asset-manager/config.json' >> "$GITHUB_ENV"
          fi

      - name: Verify Google Drive OAuth secrets
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          missing=()
          [[ -n "$GOOGLE_DRIVE_CLIENT_ID" ]] || missing+=(GOOGLE_DRIVE_CLIENT_ID)
          [[ -n "$GOOGLE_DRIVE_CLIENT_SECRET" ]] || missing+=(GOOGLE_DRIVE_CLIENT_SECRET)
          [[ -n "$GOOGLE_DRIVE_REFRESH_TOKEN" ]] || missing+=(GOOGLE_DRIVE_REFRESH_TOKEN)
          if (( ${#missing[@]} )); then
            echo "::error::Missing required Google Drive OAuth secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Exchange Google Drive OAuth refresh token
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --request POST "https://oauth2.googleapis.com/token" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=$GOOGLE_DRIVE_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_DRIVE_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_DRIVE_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" \
            --output "$response_file"
          access_token="$(node -e 'const fs = require("fs"); let response; try { response = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); } catch { process.exit(1); } if (typeof response.access_token !== "string" || !response.access_token) process.exit(1); process.stdout.write(response.access_token);' "$response_file")" || {
            echo "::error::Google Drive OAuth token exchange returned no access token"
            exit 1
          }
          echo "::add-mask::$access_token"
          printf 'GOOGLE_DRIVE_ACCESS_TOKEN=%s\n' "$access_token" >> "$GITHUB_ENV"

      - name: Analyze visual asset candidates
        run: |
          set -euo pipefail
          bootstrap_args=()
          if [[ -n "${{ inputs.bootstrap_manifest }}" ]]; then
            bootstrap_args=(--bootstrap-manifest "${{ inputs.bootstrap_manifest }}")
          fi
          node scripts/assets/asset-manager.mjs \
            --config "$ASSET_MANAGER_CONFIG_PATH" \
            --content "${{ inputs.content_file }}" \
            --dry-run "${{ inputs.dry_run }}" \
            --max-downloads "${{ inputs.max_downloads }}" \
            --allow-copyrighted-editorial "${{ inputs.allow_copyrighted_editorial }}" \
            --bootstrap-only "${{ inputs.bootstrap_only }}" \
            --expected-bootstrap-assets "${{ inputs.expected_bootstrap_assets }}" \
            "${bootstrap_args[@]}" \
            --report asset-manager/reports/latest.json

      - name: Remove controlled editorial trial config
        if: always()
        run: |
          set -euo pipefail
          if [[ "${ASSET_MANAGER_CONFIG_PATH:-}" == "$RUNNER_TEMP/"* ]]; then
            rm -f "$ASSET_MANAGER_CONFIG_PATH"
          fi

      - name: Upload dry-run report
        if: always() && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: playeconomy-asset-manager-dry-run-report
          path: asset-manager/reports/latest.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload download review artifact
        if: always() && inputs.dry_run == false
        uses: actions/upload-artifact@v4
        with:
          name: playeconomy-asset-manager-download-review
          path: |
            asset-manager/reports/latest.json
            asset-manager/manifest.json
          if-no-files-found: error
          retention-days: 7
