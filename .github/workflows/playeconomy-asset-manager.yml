name: PlayEconomy Asset Manager

on:
  workflow_dispatch:
    inputs:
      content_file:
        description: Content definition to analyze
        required: true
        default: content/guitar-hero.json
      dry_run:
        description: Analyze candidates without downloads, Drive writes, or manifest changes
        required: true
        type: boolean
        default: true
      max_downloads:
        description: Maximum proposed downloads when dry run is disabled
        required: true
        default: "5"

permissions:
  contents: read
  id-token: write

jobs:
  manage-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud for Drive upload
        if: inputs.dry_run == false
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/619079310317/locations/global/workloadIdentityPools/playeconomy-github/providers/github-actions
          service_account: playeconomy-github@playeconomy-automation.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive

      - name: Analyze visual asset candidates
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          node scripts/assets/asset-manager.mjs \
            --content "${{ inputs.content_file }}" \
            --dry-run "${{ inputs.dry_run }}" \
            --max-downloads "${{ inputs.max_downloads }}" \
            --report asset-manager/reports/latest.json

      - name: Upload dry-run report
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: playeconomy-asset-manager-dry-run-report
          path: asset-manager/reports/latest.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload download review artifact
        if: inputs.dry_run == false
        uses: actions/upload-artifact@v4
        with:
          name: playeconomy-asset-manager-download-review
          path: |
            asset-manager/reports/latest.json
            asset-manager/manifest.json
            .cache/assets/
          if-no-files-found: error
          retention-days: 7
