name: Guitar Hero proof video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Install free text to speech
        run: python -m pip install --disable-pip-version-check edge-tts

      - name: Create narration captions and local visuals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          cat > output/narration.txt <<'EOF'
          ¿Qué pasó con Guitar Hero? Convirtió guitarras de plástico en un negocio gigantesco. Pero demasiados lanzamientos y accesorios caros saturaron el mercado. Las ventas cayeron y la franquicia se apagó. Su historia demuestra que incluso un éxito puede agotarse.
          EOF

          cat > output/captions.ass <<'EOF'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding
          Style: Default,DejaVu Sans,52,&H00FFFFFF,&H000000FF,&H90000000,&H00000000,-1,0,0,0,100,100,0,0,1,3,0,2,80,80,150,1

          [Events]
          Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text
          Dialogue: 0,0:00:00.00,0:00:03.50,Default,,0,0,0,,¿Qué pasó con Guitar Hero?
          Dialogue: 0,0:00:03.50,0:00:07.50,Default,,0,0,0,,Convirtió guitarras de plástico en un negocio gigantesco.
          Dialogue: 0,0:00:07.50,0:00:12.00,Default,,0,0,0,,Demasiados lanzamientos y accesorios saturaron el mercado.
          Dialogue: 0,0:00:12.00,0:00:16.00,Default,,0,0,0,,Las ventas cayeron y la franquicia se apagó.
          Dialogue: 0,0:00:16.00,0:00:20.00,Default,,0,0,0,,Incluso un éxito puede agotarse.
          EOF

          edge-tts --voice es-CO-GonzaloNeural --file output/narration.txt --write-media output/narration.mp3

          ffmpeg -y -f lavfi -i "color=c=0x101820:s=1080x1920:r=30:d=20" -vf "drawbox=x=0:y=0:w=1080:h=330:color=0xE63946:t=fill,drawbox=x=170:y=800:w=740:h=720:color=0x1D3557:t=fill,drawbox=x=500:y=770:w=80:h=500:color=0xE63946:t=fill,drawbox=x=380:y=1210:w=320:h=280:color=0xF4A261:t=fill,drawbox=x=420:y=1300:w=240:h=100:color=0xE63946:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='PLAY ECONOMY':fontcolor=white:fontsize=52:x=(w-text_w)/2:y=115,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='QUE PASO CON':fontcolor=white:fontsize=72:x=(w-text_w)/2:y=450,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='GUITAR HERO?':fontcolor=white:fontsize=88:x=(w-text_w)/2:y=550,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='DEL FENOMENO A LA SATURACION':fontcolor=white:fontsize=34:x=(w-text_w)/2:y=660,subtitles=output/captions.ass:fontsdir=/usr/share/fonts/truetype/dejavu" -c:v libx264 -preset veryfast -pix_fmt yuv420p output/visuals.mp4

          ffmpeg -y -i output/visuals.mp4 -i output/narration.mp3 -c:v copy -c:a aac -b:a 192k -shortest output/guitar-hero-proof.mp4
          test -s output/guitar-hero-proof.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 output/guitar-hero-proof.mp4

      - name: Upload proof video
        uses: actions/upload-artifact@v4
        with:
          name: guitar-hero-proof-mp4
          path: output/guitar-hero-proof.mp4
          if-no-files-found: error
          retention-days: 7
